<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title | default: site.github.repository_name }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --border: #d0d7de;
      --accent: #0969da;
      --code-bg: #f6f8fa;
      --header-bg: #f6f8fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --accent: #58a6ff;
        --code-bg: #161b22;
        --header-bg: #161b22;
      }
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
                   Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 16px;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header.site-header {
      border-bottom: 1px solid var(--border);
      background: var(--header-bg);
      padding: 1rem 0;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    header.site-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .site-title {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--fg);
    }
    .site-title:hover { text-decoration: none; color: var(--accent); }

    nav.site-nav a {
      margin-left: 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    nav.site-nav a:hover { color: var(--accent); text-decoration: none; }

    main {
      padding: 2rem 0 3rem;
    }

    h1, h2, h3, h4 {
      line-height: 1.25;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }
    h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: .3rem; }
    h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: .3rem; }
    h3 { font-size: 1.25rem; }

    p, ul, ol, blockquote, table, pre { margin-bottom: 1rem; }

    code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                   "Liberation Mono", monospace;
      font-size: 0.9em;
      background: var(--code-bg);
      padding: 0.15em 0.35em;
      border-radius: 6px;
    }

    pre {
      background: var(--code-bg);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border);
    }
    pre code {
      background: transparent;
      padding: 0;
      font-size: 0.875em;
    }

    blockquote {
      margin-left: 0;
      padding: 0.25rem 1rem;
      color: var(--muted);
      border-left: 4px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    th { background: var(--code-bg); }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    img { max-width: 100%; height: auto; }

    /* Mermaid: fondo transparente para integrarse con el tema */
    .mermaid {
      text-align: center;
      margin: 1.5rem 0;
      background: transparent;
    }

    footer.site-footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
      padding: 1.5rem 0;
      text-align: center;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      h2 { font-size: 1.3rem; }
      nav.site-nav a { margin-left: 0.75rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="{{ '/' | relative_url }}">
        {{ site.title | default: site.github.repository_name | default: 'Inicio' }}
      </a>
      {% if site.nav %}
      <nav class="site-nav">
        {% for item in site.nav %}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>
      {% endif %}
    </div>
  </header>

  <main>
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      &copy; {{ site.time | date: "%Y" }} {{ site.title | default: site.github.repository_name }}
    </div>
  </footer>

  <script type="module">
    // Jekyll genera class="language-mermaid"; Mermaid espera class="mermaid"
    Array.from(document.getElementsByClassName("language-mermaid"))
      .forEach(el => el.classList.add("mermaid"));

    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    // Sincroniza el tema de Mermaid con el modo claro/oscuro del sistema
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    mermaid.initialize({
      startOnLoad: true,
      theme: isDark ? 'dark' : 'default',
      securityLevel: 'loose',
      flowchart: { useMaxWidth: true, htmlLabels: true }
    });

    // Si el usuario cambia el tema del sistema, recarga para re-renderizar
    window.matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', () => location.reload());
  </script>
</body>
</html>
